version: '3.3'

services:
  video-translate:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # 输出文件持久化到宿主机
      - ./outputs:/root/video_translate_outputs
      # faster-whisper 通过 HuggingFace 缓存模型，路径与旧版 openai-whisper 不同
      - huggingface-cache:/root/.cache/huggingface
    env_file:
      - .env
    restart: unless-stopped

volumes:
  huggingface-cache:
